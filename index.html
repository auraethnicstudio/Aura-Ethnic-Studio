<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#241d19">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>Link Unavailable</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f2ed;color:#291f1b;font-family:Arial,sans-serif}.card{width:min(480px,100%);padding:42px 28px;text-align:center;background:#fff;border:1px solid #eaded6;box-shadow:0 18px 50px rgba(65,43,31,.09)}.mark{font:34px Georgia,serif;letter-spacing:5px;margin-bottom:26px}h1{font:400 28px Georgia,serif;margin:0 0 12px}p{margin:0;color:#75665f;line-height:1.7;font-size:14px}
  </style>
</head>
<body>
  <main class="card"><div class="mark">AURA</div><h1>This link is no longer active.</h1><p>Please use the latest link shared with you.</p></main>
  <script>
  (function(){try{if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(items){items.forEach(function(item){item.unregister()})})}if("caches" in window){caches.keys().then(function(keys){keys.forEach(function(key){caches.delete(key)})})}}catch(e){}})();
  </script>
</body>
</html>
